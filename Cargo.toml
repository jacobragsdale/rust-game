[package]
name = "supergame"
version = "0.1.0"
edition = "2021"
description = "2D side-scroller adventure RPG"
# Without this, adding src/bin/sim.rs makes a bare `cargo run` ambiguous.
default-run = "supergame"

[dependencies]
anyhow = "1"
ggez = "0.9.3"
hecs = "0.10"
image = "0.24"
ron = "0.8"
tiled = "0.11"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1"
toml = "0.5.11"
